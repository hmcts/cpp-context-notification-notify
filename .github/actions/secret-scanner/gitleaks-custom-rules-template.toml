title = "Custom rules"

[extend]
useDefault = true

# Azurite well-known public development key — not a real secret.
# Published by Microsoft at: https://learn.microsoft.com/azure/storage/common/storage-use-azurite
[allowlist]
description = "Azurite public dev key allowlist"
regexes = ['''Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq''']

[[rules]]
id = "internal-urls"
description = "Identify internal urls"
regex = '''${GITLEAKS_REGEX_INTERNAL_URL}'''
tags = ["internal-urls"]

[[rules]]
id = "banned-ids"
description = "Identify banned IDs"
regex = '''${GITLEAKS_REGEX_BANNED_IDS}'''
tags = ["banned-ids"]

